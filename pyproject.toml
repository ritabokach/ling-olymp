[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lingpuzzle"
dynamic = ["version"]
description = "Generator of linguistics olympiad puzzles with a guaranteed unique answer."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.hatch.version]
path = "src/lingpuzzle/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lingpuzzle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
extend-exclude = [".claude", "swarm-report"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.format]
